<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Antaria</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

	<!-- Injected into the exported index.html by scripts/export_web.sh. Loads the Sentry browser SDK
     (crash/error reporting) and wires a custom SEMI-TRANSPARENT button in the bottom-right that opens
     the Sentry feedback form (feedback / bugs / contact). The DSN below is baked in (override with the
     SENTRY_DSN env at build time); a DSN is a public client key, safe to ship. -->
<script src="https://browser.sentry-cdn.com/8.47.0/bundle.feedback.min.js" crossorigin="anonymous"></script>
<script>
  if (window.Sentry) {
    var _fb = Sentry.feedbackIntegration({
      autoInject: false,                 // we supply our own button below
      colorScheme: "dark",
      showBranding: false,
      formTitle: "Antaria — feedback, bugs & contact",
      messagePlaceholder: "Tell us what you enjoyed, what felt off, a bug you hit, or how to reach you.",
      submitButtonLabel: "Send",
      showName: true, isNameRequired: false,
      showEmail: true, isEmailRequired: false,
    });
    Sentry.init({
      dsn: "https://0e883207678f781681b40e014d6b9bb1@o4511464385871873.ingest.us.sentry.io/4511655500709888",
      sampleRate: 1.0,
      integrations: [_fb],
    });
    window.addEventListener("load", function () {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "Feedback";
      Object.assign(b.style, {
        position: "fixed", right: "14px", bottom: "14px", zIndex: "10000",
        padding: "8px 14px", borderRadius: "9px",
        border: "1px solid rgba(255,255,255,0.35)",
        background: "rgba(18,18,26,0.45)", color: "rgba(255,255,255,0.85)",
        font: "600 14px system-ui, sans-serif", cursor: "pointer",
        backdropFilter: "blur(3px)", webkitBackdropFilter: "blur(3px)",
        transition: "background 0.15s, opacity 0.15s", opacity: "0.75",
      });
      b.onmouseenter = function () { b.style.background = "rgba(40,40,58,0.85)"; b.style.opacity = "1"; };
      b.onmouseleave = function () { b.style.background = "rgba(18,18,26,0.45)"; b.style.opacity = "0.75"; };
      document.body.appendChild(b);
      try { _fb.attachTo(b); } catch (e) { b.onclick = function () { _fb.openDialog(); }; }
    });
  }
</script>

</head>
	<body>
		<canvas id="canvas">

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">

			<div id="status-notice"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11720804,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
